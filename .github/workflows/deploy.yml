name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger, for when a push doesn't create a run
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      # The data pages bake in TH prices from assets/pricing.js (and live BTC/difficulty), so rebuild
      # them on every deploy: a price edit then reaches them with no manual step. If the generator
      # fails, the committed pages are published as they are rather than blocking the deploy.
      - name: Regenerate data pages
        run: node scripts/gen-pages.js
        continue-on-error: true
      # Publish only the site: hidden folders (.rustup, .npm, .claude, ...) are tooling that got
      # committed, and shipping 80k of their files made Pages' sync step stall and time out.
      - name: Stage site
        run: mkdir -p "$RUNNER_TEMP/site" && tar --exclude='./.*' -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
