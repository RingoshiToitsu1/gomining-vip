name: Daily SEO report

# Pulls Search Console, has Claude analyse the trend, sends the report to Telegram.
#
# Snapshots are committed to the `seo-data` BRANCH, never to main — the Pages
# deploy uploads `path: .`, so anything on main is published publicly, and our
# Search Console data should not be.
#
# Required repository secrets:
#   GSC_SERVICE_ACCOUNT  service-account JSON, whole file contents
#   ANTHROPIC_API_KEY    for the headless claude run
#   TELEGRAM_BOT_TOKEN   bot that delivers the report
#   TELEGRAM_CHAT_ID     chat the report is sent to

on:
  schedule:
    - cron: '43 7 * * *'        # 07:43 UTC daily, off the hour to dodge the rush
  workflow_dispatch:            # lets you trigger a run by hand to test

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site (main)
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: seo-data
          path: .seo-data-branch
        continue-on-error: true   # first ever run: branch does not exist yet

      - name: Seed data branch on first run
        run: |
          if [ ! -d .seo-data-branch/.git ]; then
            echo "no seo-data branch yet — initialising"
            mkdir -p .seo-data-branch
            cd .seo-data-branch
            git init -q
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git checkout -q --orphan seo-data
          fi
          mkdir -p .seo-data-branch/seo-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet google-auth requests

      - name: Write service account key
        run: |
          mkdir -p ~/.config/gsc
          printf '%s' '${{ secrets.GSC_SERVICE_ACCOUNT }}' > ~/.config/gsc/service-account.json
          chmod 600 ~/.config/gsc/service-account.json

      - name: Pull Search Console snapshot
        run: |
          ln -s "$PWD/.seo-data-branch/seo-data" seo-data 2>/dev/null || true
          python3 scripts/gsc-snapshot.py --days 28

      # Grounds the report's tweet suggestion in real figures. Non-fatal: if the
      # price/difficulty APIs are down the report still goes out, minus the tweet.
      - name: Compute today's network figures
        run: node scripts/network-facts.js || echo "network figures unavailable — report will skip the tweet suggestion"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse and write report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Use the seo-review skill. Analyse the Search Console snapshots in seo-data/ and write today's report." \
            --allowedTools "Read,Write,Glob,Grep,Bash(ls:*),Skill" \
            --permission-mode acceptEdits \
            2>&1 | tee claude-run.log

      - name: Locate report
        id: report
        run: |
          f=$(ls -1t .seo-data-branch/seo-data/report-*.md 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "no report produced — sending the run log instead"
            f=claude-run.log
          fi
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "subject=$(head -1 "$f" | sed 's/^#* *//' | cut -c1-120)" >> "$GITHUB_OUTPUT"

      - name: Send the report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/notify-telegram.js \
            --file "${{ steps.report.outputs.path }}" \
            --title "SEO — ${{ steps.report.outputs.subject }}"

      # always(): the snapshot is the durable asset and must survive a delivery
      # failure. Previously a failed send also lost the day's data.
      - name: Commit snapshot to data branch
        if: always()
        run: |
          cd .seo-data-branch
          git config user.name "seo-report[bot]"
          git config user.email "seo-report@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing new" && exit 0
          git commit -q -m "seo: snapshot $(date -u +%Y-%m-%d)"
          git push -q origin seo-data
