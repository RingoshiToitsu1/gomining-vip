name: X post (event-triggered)

# Checks for a real network event; posts only if one fired. No event, no post.
#
# Pipeline: x-watch (compute facts) -> claude (draft prose) -> x-verify (gate)
# -> x-publish. Every number in the post must trace back to x-watch's output;
# x-verify refuses to publish otherwise.
#
# Required repository secrets:
#   ANTHROPIC_API_KEY
#   X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_SECRET
#     (X developer app with Read+Write, OAuth 1.0a user-context tokens)
#
# Set vars.X_DRY_RUN = 'true' in repo variables to run the whole pipeline
# without actually posting. Do that first.

on:
  schedule:
    - cron: '17 13 * * *'       # once daily; the event check decides whether to post
  workflow_dispatch:
    inputs:
      force_event:
        description: 'Force an event type (difficulty_retarget | halving_milestone | hashprice_move)'
        required: false
      dry_run:
        description: 'Draft and verify but do not post'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: seo-data
          path: .state
        continue-on-error: true

      - name: Prepare state
        run: |
          mkdir -p .state/seo-data seo-data
          cp .state/seo-data/bot-state.json seo-data/ 2>/dev/null || true
          cp .state/seo-data/x-history.json seo-data/ 2>/dev/null || true

      - name: Check for an event
        id: watch
        run: |
          FORCE=""
          [ -n "${{ github.event.inputs.force_event }}" ] && FORCE="--force ${{ github.event.inputs.force_event }}"
          set +e
          node scripts/x-watch.js $FORCE
          code=$?
          set -e
          if [ $code -eq 3 ]; then echo "fired=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $code -ne 0 ]; then exit $code; fi
          echo "fired=true" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.watch.outputs.fired == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Draft the post
        if: steps.watch.outputs.fired == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Use the x-post skill. Read x-event.json and write x-draft.txt." \
            --allowedTools "Read,Write,Skill" \
            --permission-mode acceptEdits

      - name: Verify the draft
        if: steps.watch.outputs.fired == 'true'
        run: |
          node scripts/x-verify.js \
            --draft x-draft.txt \
            --event x-event.json \
            --history seo-data/x-history.json

      - name: Publish
        if: steps.watch.outputs.fired == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          DRY=""
          if [ "${{ vars.X_DRY_RUN }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry"; fi
          node scripts/x-publish.js --draft x-draft.txt --history seo-data/x-history.json $DRY

      - name: Persist state
        if: always()
        run: |
          cd .state 2>/dev/null || exit 0
          mkdir -p seo-data
          cp ../seo-data/bot-state.json seo-data/ 2>/dev/null || true
          cp ../seo-data/x-history.json seo-data/ 2>/dev/null || true
          git config user.name "x-post[bot]"
          git config user.email "x-post@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -q -m "x-post: state $(date -u +%Y-%m-%dT%H:%M)"
          git push -q origin seo-data
